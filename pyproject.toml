[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aperio"
version = "2.0.0.dev0"
description = "A bounded, evidence-first project orchestrator."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
aperio = "aperio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
